<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .page {
            width: 100%;
        }

        .page1 {
            width: 210vh;
            height: 100vh;
            background-color: red;
        }

        .page2 {
            width: 210vh;
            height: 100vh;
            background-color: green;
            position: relative;
        }

        .page3 {
            width: 210vh;
            height: 100vh;
            background-color: yellow;
        }

        .page4 {
            width: 210vh;
            height: 100vh;
            background-color: pink;
        }

        /* CHATBOT AREA:
           Starts at half of GREEN
           Ends at half of YELLOW
        */
        .chatbot-area {
            position: absolute;
            top: 50vh;
            left: 0;
            width: 100%;
            height: 100vh;
           
        }

        .chatbot {
            position: sticky;
            top: 45vh;
            left: 0;
            width: 100%;
            height: 60px;
                   }

        .box {
            height: 20px;
            width: 200px;
            border: 5px solid black;
            position: absolute;
            top: 0;
            right: 100px;
            color: white;
        }

        .chatbot img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            position: absolute;
            top: -10px;
            right: 40px;
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="page1"></div>

        <div class="page2">

            <!-- CHATBOT STARTS FROM HALF OF GREEN -->
            <div class="chatbot-area">

                <div class="chatbot">

                    <div class="box">
                        Hey good morning!
                    </div>

                    <img src="https://assets-v2.lottiefiles.com/a/decf4a3e-f47e-11ef-9a9d-2386c1245eb1/LY89s3JCNl.gif"
                         alt="chatbot">

                </div>

            </div>

        </div>

        <div class="page3"></div>

        <div class="page4"></div>

    </div>

</body>
</html>
