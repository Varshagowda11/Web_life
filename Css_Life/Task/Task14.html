<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        html{
            width: 100vw;
            height: 100vh;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
                
        .main{
            width: 350px;
            height: 350px;
            border: 3px solid white;
            position: relative;
            border-radius: 50%;
            animation: box 5s ;
            animation-iteration-count: infinite;
            box-shadow: 2px 2px 20px white;

        }
        .child{
            width: 70px;
            height: 70px;
            background-color: gold;
            box-shadow: 2px 2px 30px gold;

            position: absolute;
            border-radius: 50%;
            top: 20px;
        }
        @keyframes box {
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
            
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="child"></div>
    </div>
</body>
</html>
