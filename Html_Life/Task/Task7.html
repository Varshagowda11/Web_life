<body>

            </li>

                    </li>
                </ul>
            </li>
            <li>
                <label for="">How satisfied were you with our services?</label> <br> <br>
                <ul type="disc">
                    <li>
                        <label for="">Very satisfied</label>
                        <input type="radio" name="sat">

                    </li>
                    <li>
                        <label for="">satisfied</label>
                        <input type="radio" name="sat">

                    </li>
                    <li>
                        <label for="">Didn't care</label>
                        <input type="radio" name="sat">

                    </li>
                    <li>
                        <label for="">Dissatisifed</label>

                    </li>
                    <li>
                        <label for=""> Very Dissatisifed</label>
                        <input type="radio" name="sat"> <br><br>

                    </li>
                </ul>
            <li>
                <label for="">Further comments:</label>

            </li>
            <li>
                <label for="">Bio photo:</label>
                <input type="text" name="ubp" > <br><br>
            </li>
            <li>

                <input type="search" placeholder="Select Location" name="ulc"> <br><br>
            </li>
            </li>

            <li>
                <button>submit</button>
